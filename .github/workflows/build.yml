name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean-base:
    name: Lean dependency base
    outputs:
      cache-hit: ${{ steps.lean-cache.outputs.cache-hit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Download mathlib cache with bounded retries
        run: bash scripts/fetch_mathlib_cache.sh
      - uses: actions/cache/restore@v6.1.0
        id: lean-cache
        with:
          path: .lake/build
          key: lean-linux-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'LeanMath.lean', 'LeanMath/**/*.lean', 'research/**/*.lean', 'lean/**/*.lean', 'scripts/build_lean.py') }}
          restore-keys: |
            lean-linux-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
            lean-linux-v1-204f6bdc3812881bcfc18b74c411324d36528b2b563ddd40eaaca93ec6a20424
      # Optional one-time cache seed from a trusted run of this repository.
      # Lake still checks source/dependency hashes and rebuilds stale modules.
      - uses: actions/download-artifact@v8.0.1
        if: steps.lean-cache.outputs.cache-hit != 'true' && vars.LEAN_BOOTSTRAP_RUN != ''
        continue-on-error: true
        with:
          pattern: lean-segments-*
          merge-multiple: true
          path: ${{ runner.temp }}/lean-bootstrap
          run-id: ${{ vars.LEAN_BOOTSTRAP_RUN }}
          github-token: ${{ github.token }}
      - name: Restore available bootstrap artifacts
        if: steps.lean-cache.outputs.cache-hit != 'true' && vars.LEAN_BOOTSTRAP_RUN != ''
        run: |
          for archive in "$RUNNER_TEMP"/lean-bootstrap/*.tar.gz; do
            [ -f "$archive" ] || continue
            tar xzf "$archive"
          done
      - run: python3 scripts/build_lean.py --phase base --batch-size 4
      - run: tar czf "$RUNNER_TEMP/lean-base.tar.gz" .lake/build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: lean-base
          path: ${{ runner.temp }}/lean-base.tar.gz
          retention-days: 2
  lean-segments:
    name: Lean polynomial certificates (${{ matrix.shard }})
    needs: lean-base
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Download mathlib cache with bounded retries
        run: bash scripts/fetch_mathlib_cache.sh
      - uses: actions/download-artifact@v8.0.1
        with:
          name: lean-base
          path: ${{ runner.temp }}
      - run: tar xzf "$RUNNER_TEMP/lean-base.tar.gz"
      - run: python3 scripts/build_lean.py --phase segments --shard ${{ matrix.shard }} --shards 4 --batch-size 2
      - run: tar czf "$RUNNER_TEMP/lean-segments-${{ matrix.shard }}.tar.gz" .lake/build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: lean-segments-${{ matrix.shard }}
          path: ${{ runner.temp }}/lean-segments-${{ matrix.shard }}.tar.gz
          retention-days: 2
  lean:
    name: Complete Lean build and separate axiom audits
    needs: [lean-base, lean-segments]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Download mathlib cache with bounded retries
        run: bash scripts/fetch_mathlib_cache.sh
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: lean-segments-*
          merge-multiple: true
          path: ${{ runner.temp }}/lean-parts
      - run: |
          for archive in "$RUNNER_TEMP"/lean-parts/*.tar.gz; do
            tar xzf "$archive"
          done
      - run: python3 scripts/build_lean.py --phase final
      - run: python3 scripts/audit_lean.py
      - run: python3 scripts/audit_fast_power.py
      - run: python3 scripts/audit_circle_safeguard.py
      - run: python3 scripts/audit_branch.py
      - run: python3 scripts/audit_circle_v23.py
      - run: python3 scripts/audit_native_nondegeneracy.py
      - run: python3 scripts/audit_initialization.py
      - run: python3 scripts/audit_analog_fast_ad.py
      - uses: actions/cache/save@v6.1.0
        if: needs.lean-base.outputs.cache-hit != 'true'
        with:
          path: .lake/build
          key: lean-linux-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'LeanMath.lean', 'LeanMath/**/*.lean', 'research/**/*.lean', 'lean/**/*.lean', 'scripts/build_lean.py') }}
  mathematics:
    name: Symbolic and high precision geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: paper/reciprocal_geometry_v20/requirements.txt
      - run: pip install -r paper/reciprocal_geometry_v20/requirements.txt
      - working-directory: paper/reciprocal_geometry_v20
        run: |
          python src/revision/verify.py
          python src/review/check_math.py
          python src/fixed_circle/verify.py
          python src/stereo/model.py
          python src/decentered/verify.py
      - run: python paper/reciprocal_geometry_v21/draw_figures.py
      - run: python paper/reciprocal_geometry_v21/draw_pandrosion.py
      - run: python research/fixed_circle_safeguard/verify.py
      - run: python research/fixed_circle_safeguard/draw.py
      - run: python paper/reciprocal_geometry_v25/src/positioning/verify.py
      - run: python paper/reciprocal_geometry_v25/src/uniform/verify.py
      - run: python paper/reciprocal_geometry_v25/src/branch/protocol.py
      - run: python paper/reciprocal_geometry_v22/src/branch/verify.py
      - run: python paper/reciprocal_geometry_v22/src/branch/protocol.py
      - run: python paper/reciprocal_geometry_v22/src/branch/figure.py
      - run: python paper/reciprocal_geometry_v22/src/branch/fold.py
      - run: python paper/reciprocal_geometry_v22/draw_figures.py
      - run: python paper/reciprocal_geometry_v22/draw_pandrosion.py
      - run: python paper/reciprocal_geometry_v22/draw_safeguard.py
      - run: python scripts/test_native_nondegeneracy.py
      - run: python scripts/check_initialization.py
      - run: python paper/pandrosion_analog_v30/draw_fast_geometry.py
      - run: python paper/pandrosion_analog_v30/draw_circuit.py
  paper:
    name: Build V20, V17 and V30 papers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Tectonic 0.17.0
        run: |
          curl -fsSL https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/tectonic.tar.gz
          echo '8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7  /tmp/tectonic.tar.gz' | sha256sum -c -
          tar xzf /tmp/tectonic.tar.gz -C /tmp
          sudo install /tmp/tectonic /usr/local/bin/tectonic
      # Keep this job name stable: main protection requires its status context.
      - run: bash paper/reciprocal_geometry_v25/build.sh
      - run: bash paper/reciprocal_geometry_v24/build.sh
      - run: bash paper/reciprocal_geometry_v23/build.sh
      - run: bash paper/reciprocal_geometry_v22/build.sh
      - run: bash paper/reciprocal_geometry_v21/build.sh
      - run: bash paper/reciprocal_geometry_v20/build.sh
      - run: bash paper/pandrosion_analog_v17/build.sh
      - run: python3 paper/pandrosion_analog_v30/check_results.py
      - run: bash paper/pandrosion_analog_v30/build.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: papers
          path: |
            paper/reciprocal_geometry_v25/Reciprocal_Root_Geometry_v25.pdf
            paper/reciprocal_geometry_v24/Reciprocal_Root_Geometry_v24.pdf
            paper/reciprocal_geometry_v23/Reciprocal_Root_Geometry_v23.pdf
            paper/reciprocal_geometry_v22/Reciprocal_Root_Geometry_v22.pdf
            paper/reciprocal_geometry_v21/Reciprocal_Root_Geometry_v21.pdf
            paper/reciprocal_geometry_v20/Reciprocal_Root_Geometry_v20.pdf
            paper/pandrosion_analog_v17/Pandrosion_Geometry_Analog_V17.pdf
            paper/pandrosion_analog_v30/Pandrosion_Geometry_Analog_V30.pdf
  analog:
    name: Analog SPICE simulations and accuracy budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/pandrosion_analog_p4/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ngspice
      - run: pip install -r research/pandrosion_analog_p4/requirements.txt -r research/analog_fast_ad/requirements.txt
      - run: python research/pandrosion_analog_p4/simulate_p4.py
      - run: python research/pandrosion_analog_p4/verify_p4.py
      - run: python research/analog_fast_ad/verify.py
      - run: python research/analog_fast_ad/model.py
      - run: python research/analog_fast_ad/precision.py
      - run: python research/analog_fast_ad/spice.py
      - run: python research/analog_fast_ad/characterize.py
      - run: python research/analog_fast_ad/characterize_spice.py
      - run: python research/analog_fast_ad/joint_spice.py
      - run: python research/analog_fast_ad/calibrate_cells.py
      - run: node research/analog_fast_ad/benchmark.mjs
      - run: python research/analog_fast_ad/validate_comparison.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: analog-p4-results
          path: |
            research/pandrosion_analog_p4/results.json
            research/pandrosion_analog_p4/VALIDATION.json
            research/analog_fast_ad/model_results.json
            research/analog_fast_ad/precision_results.json
            research/analog_fast_ad/spice_results.json
            research/analog_fast_ad/characterization_results.json
            research/analog_fast_ad/characterization_spice.json
            research/analog_fast_ad/joint_spice_results.json
            research/analog_fast_ad/calibration_results.json
            research/analog_fast_ad/benchmark_results.json
  previews:
    name: Interactive geometry and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test_geometry.mjs
      - run: node scripts/test_initialization.mjs
      - run: node scripts/test_layout.mjs
      - run: node scripts/test_stereography.mjs
      - run: |
          python3 -m http.server 8765 --directory docs > /tmp/preview-server.log 2>&1 &
          node scripts/test_browser.mjs
          node scripts/test_sphere_drag.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: preview-screenshots
          path: .ci/browser
  analog-generalist:
    name: Generalist root campaign and clock alternatives
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ngspice
      - run: pip install -r research/analog_fast_ad/requirements.txt
      - run: python research/analog_fast_ad/generalist_campaign.py
      - run: python research/analog_fast_ad/generalist_spice.py --workers 2
      - run: python research/analog_fast_ad/clock_modes.py
      - run: python research/analog_fast_ad/streaming_campaign.py
      - run: python research/analog_fast_ad/generalist_report.py
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: generalist-campaign-results
          path: |
            research/analog_fast_ad/generalist_algorithm.*
            research/analog_fast_ad/generalist_spice.json
            research/analog_fast_ad/generalist_spice.jsonl
            research/analog_fast_ad/clock_modes_results.json
            research/analog_fast_ad/clock_modes_waveforms.csv
            research/analog_fast_ad/streaming_results.json
            research/analog_fast_ad/GENERALIST_RESULTS.md
            research/analog_fast_ad/generalist_results.png
  analog-precision:
    name: Precision circuit and noisy completion controller
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Hosted CPUs need more wall time for long precision-mode transients.
      # These budgets do not change SPICE time steps or electrical parameters.
      PANDROSION_SPICE_TIMEOUT_SECONDS: '600'
      PANDROSION_SPICE_WORKERS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ngspice
      - run: pip install -r research/analog_fast_ad/requirements.txt
      - run: python research/analog_fast_ad/validate_revised.py
      - run: python research/analog_fast_ad/revised_ablation.py
      - run: python research/analog_fast_ad/noisy_controller.py
      - run: python research/analog_fast_ad/precision_revision_report.py
      - run: python research/analog_fast_ad/speed_accuracy.py
      - run: python research/analog_fast_ad/speed_accuracy_report.py
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: precision-revision-results
          path: |
            research/analog_fast_ad/revised_validation.json
            research/analog_fast_ad/revised_ablation.json
            research/analog_fast_ad/noisy_controller_results.json
            research/analog_fast_ad/PRECISION_REVISION_RESULTS.md
            research/analog_fast_ad/precision_revision.png
            research/analog_fast_ad/precision_revision.svg
            research/analog_fast_ad/speed_accuracy*.json
            research/analog_fast_ad/speed_accuracy.png
            research/analog_fast_ad/speed_accuracy.svg
            research/analog_fast_ad/SPEED_ACCURACY.md
