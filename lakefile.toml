name = "lean_math"
version = "0.1.0"
defaultTargets = ["LeanMath", "research", "lean"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "LeanMath"

[[lean_lib]]
name = "research"
globs = ["research.+"]

[[lean_lib]]
name = "lean"
globs = ["lean.+"]
