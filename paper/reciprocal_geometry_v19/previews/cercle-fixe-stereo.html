<div id="fc-stereo">
<h2>Cercle fixe · construction stéréographique</h2>
<div class="viz-controls">
<label class="form-label">Degré p<select class="form-select" id="fs-p"><option>3</option><option>4</option><option>5</option><option>7</option><option>12</option></select></label>
<label class="form-label">Nombre X<input class="form-control" id="fs-x" type="number" value="2" step="0.1" min="0.01"></label>
<label class="form-label">État réciproque s<input class="form-control" id="fs-s" type="number" value="0.75" step="0.01" min="0.001"></label>
<label class="form-label">Exemple<select class="form-select" id="fs-case"><option value="regular">Huit droites, p = 3</option><option value="initial">V au pôle Nord</option><option value="final">U au pôle Nord</option></select></label>
</div>
<div id="fs-error" class="text-destructive" role="alert" hidden></div>
<div class="fs-panels">
<div><div class="text-small">Sphère · glisser pour tourner</div><svg class="fs-sphere" role="img" aria-label="Image stéréographique des droites et du cercle fixe"></svg></div>
<div><div class="text-small">Plan · échelle identique sur les deux axes</div><svg class="fs-plane" role="img" aria-label="Construction plane correspondante"></svg></div>
</div>
<div class="viz-row"><button class="btn" id="fs-prev" type="button">← Trait</button><button class="btn" id="fs-next" type="button">Trait →</button><span id="fs-step-name" aria-live="polite"></span></div>
<label class="form-label">Construction<input class="form-range" id="fs-step" type="range" min="0" max="8" value="8"></label>
<div class="viz-controls"><label class="form-label">Rotation<input class="form-range" id="fs-yaw" type="range" min="-180" max="180" value="-35"></label><label class="form-label">Inclinaison<input class="form-range" id="fs-pitch" type="range" min="-80" max="80" value="22"></label></div>
<div class="viz-row text-small"><span>Γ : cercle fixe, sans passage par N</span><span>N : image des directions à l’infini</span><span>Pointillés : face arrière</span></div>
<div id="fs-result" class="tabular-nums" aria-live="polite"></div>
</div>
<style>
#fc-stereo .fs-panels{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-block:14px}
#fc-stereo .fs-panels svg{display:block;width:100%;height:auto;overflow:hidden}
#fc-stereo .fs-sphere{touch-action:none;cursor:grab}
#fc-stereo svg text{fill:var(--foreground);font-size:12px;font-weight:400}
#fc-stereo #fs-result{margin-block:12px;overflow-wrap:anywhere}
@media(max-width:620px){#fc-stereo .fs-panels{grid-template-columns:1fr}}
</style>
<script>
(()=>{
const root=document.getElementById('fc-stereo'),q=s=>root.querySelector(s),NS='http://www.w3.org/2000/svg';let g=null;
const cross=(a,b)=>{let v=[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],m=Math.max(...v.map(Math.abs));if(m<1e-13)throw Error('Incidence dégénérée : points ou droites confondus.');return v.map(x=>x/m)};
const affine=a=>Math.abs(a[2])<1e-11?null:[a[0]/a[2],a[1]/a[2]];
const stereo=a=>{let [xx,yy,w]=a,x=xx-w,y=yy-2*w,z=2*w,d=x*x+y*y+z*z;return [2*x*z/d,2*y*z/d,(x*x+y*y-z*z)/d]};
function params(p){if(p===4)return [1/3,13502/7167,3328/2389,-214/2389,2432/2389,145/2389];let L=p**3+12*p*p+39*p-26;return [.5,2-72*p*(p+4)/((p-1)*L),24*p*(p-2)*(p+4)/((p-1)*L),2-24*p*(p+4)*(p-2)/((p-4)*L),24*p*(p*p+2*p-26)/((p-4)*L),(p-2)*(p*p-4*p+13)/L]}
function geometry(){let p=+q('#fs-p').value,X=+q('#fs-x').value,s=+q('#fs-s').value;if(!(X>0&&s>0&&Number.isFinite(X*s)))throw Error('X et s doivent être positifs et finis.');let [rho,h,j,zx,zy,k]=params(p),M=[h,j],rad=Math.hypot(2-h,j),pts={O:[0,4,1],A:[2,4,1],B:[2,0,1],C:[0,0,1],P:[2,4*(1-s),1],Z:[zx,zy,1]},ops=[],top=[0,1,-4],left=[1,0,0],right=[1,0,-2];function meet(a,b,rail,name,label){let line=cross(pts[a],pts[b]);pts[name]=cross(line,rail);ops.push({a,b,name,line,label});return name}
meet('C','P',top,'V','CP → centre V');let curr='P';for(let i=1;i<p;i++){let f=i===1?rho:i===p-1?k*X*2**(p-3)/rho:.5,F='F'+i;pts[F]=[2*f,4*(f-1),f-1];let L=meet(F,curr,left,'L'+i,'Projection vers le rail gauche');curr=meet('V',L,right,i===p-1?'T':'Q'+i,i===p-1?'T encode kXsᵖ':'Multiplication par s')}
let line=cross(pts.Z,pts.T),[a,b,c]=line,norm=Math.hypot(a,b),dist=(a*h+b*j+c)/norm,d2=rad*rad-dist*dist;if(!(d2>1e-13))throw Error('ZT ne traverse pas Γ : hors du domaine réel, ou tangence.');let foot=[h-dist*a/norm,j-dist*b/norm],off=[-b/norm*Math.sqrt(d2),a/norm*Math.sqrt(d2)],candidates=[-1,1].map(sign=>{let pt=[foot[0]+sign*off[0],foot[1]+sign*off[1],1],dx=pt[0]-2,dy=pt[1],v=rho*4*dx/(4*dx+2*dy);return {pt,v,der:(p*p-4)*(v*v+1)-2*(p*p+2)*v}}),sel=candidates.filter(a=>a.der<0);if(sel.length!==1)throw Error('Branche inverse indéterminée à cette précision.');pts.G=sel[0].pt;pts.Gother=candidates.find(a=>a!==sel[0]).pt;ops.push({a:'Z',b:'T',name:'G',line,label:'ZT ∩ Γ → G, branche centrale'});meet('B','G',top,'U','BG → centre de lecture U');meet('U','L1',right,'Pnext','UL₁ → P⁺');let f=affine(pts.Pnext);if(!f)throw Error('Lecture finale à l’infini.');return {p,X,s,pts,ops,M,rad,value:1-f[1]/4}}
function samples(l){let [a,b,c]=l,d=a*a+b*b,len=Math.sqrt(d),out=[];for(let i=0;i<=280;i++){let t=-Math.PI/2+Math.PI*i/280,cs=Math.cos(t),sn=Math.sin(t);out.push([-a*c/d*cs-b/len*sn,-b*c/d*cs+a/len*sn,cs])}return out}
function add(svg,tag,attrs={},txt){let n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));if(txt!==undefined)n.textContent=txt;svg.append(n);return n}
function draw(){let sphere=q('.fs-sphere'),plane=q('.fs-plane');sphere.replaceChildren();plane.replaceChildren();if(!g)return;let n=Math.min(+q('#fs-step').value,g.ops.length),yaw=+q('#fs-yaw').value*Math.PI/180,pitch=+q('#fs-pitch').value*Math.PI/180,sw=sphere.parentElement.clientWidth,sh=Math.min(430,Math.max(300,sw)),rr=Math.min(sw-58,sh-58)/2;sphere.setAttribute('viewBox',`0 0 ${sw} ${sh}`);let view=z=>{let x=Math.cos(yaw)*z[0]-Math.sin(yaw)*z[1],y=Math.sin(yaw)*z[0]+Math.cos(yaw)*z[1];return [sw/2+rr*x,sh/2-rr*(Math.cos(pitch)*z[2]-Math.sin(pitch)*y),Math.sin(pitch)*z[2]+Math.cos(pitch)*y]};add(sphere,'title',{},'Stéréographie : trait '+n+' sur '+g.ops.length);add(sphere,'circle',{cx:sw/2,cy:sh/2,r:rr,fill:'none',stroke:'var(--border)','stroke-width':1});
function curve(points,color,width=1,opacity=1){let vv=points.map(view),path='',prev=null;for(let i=0;i<vv.length;i++){let cur=vv[i],back=cur[2]<0;if(prev!==null&&back!==prev){add(sphere,'path',{d:path,fill:'none',stroke:color,'stroke-width':width,opacity:prev?opacity*.23:opacity,'stroke-dasharray':prev?'3 4':'none'});path=`M${vv[i-1][0]},${vv[i-1][1]}`};path+=(path?'L':'M')+cur[0]+','+cur[1];prev=back}if(path)add(sphere,'path',{d:path,fill:'none',stroke:color,'stroke-width':width,opacity:prev?opacity*.23:opacity,'stroke-dasharray':prev?'3 4':'none'})}
for(let lat of [-.6,0,.6]){let a=[];for(let i=0;i<=180;i++){let t=i*Math.PI/90,r=Math.sqrt(1-lat*lat);a.push([r*Math.cos(t),r*Math.sin(t),lat])}curve(a,'var(--border)',.7,.65)}
for(let l of [[0,1,-4],[1,0,0],[1,0,-2]])curve(samples(l).map(stereo),'var(--foreground)',.8,.28);
let circle=[];for(let i=0;i<=360;i++){let t=2*Math.PI*i/360;circle.push(stereo([g.M[0]+g.rad*Math.cos(t),g.M[1]+g.rad*Math.sin(t),1]))}curve(circle,'var(--viz-series-2)',2,1);
for(let i=0;i<n;i++)curve(samples(g.ops[i].line).map(stereo),i===n-1?'var(--viz-series-1)':'var(--foreground)',i===n-1?2.2:.8,i===n-1?1:.26);
let occupied=[];function marker(pt,name,active=false){let v=view(pt),x=v[0],y=v[1];add(sphere,'circle',{cx:x,cy:y,r:active?4.5:3,fill:active?'var(--viz-series-1)':'var(--foreground)',opacity:v[2]<0?.5:1});let len=name.length*7+4;for(let [dx,dy] of [[8,-9],[8,19],[-len-8,-9],[-len-8,19],[8,-28],[-len-8,35]]){let b={x:x+dx,y:y+dy-12,w:len,h:16};if(b.x<2||b.x+b.w>sw-2||b.y<2||b.y+b.h>sh-2||occupied.some(a=>b.x<a.x+a.w+4&&b.x+b.w+4>a.x&&b.y<a.y+a.h+4&&b.y+b.h+4>a.y))continue;add(sphere,'text',{x:b.x,y:y+dy},name);occupied.push(b);break}}
let current=n?g.ops[n-1].name:null,infinite=current&&!affine(g.pts[current]);marker([0,0,1],infinite?(current+' = N'):'N',!!infinite);if(current&&!infinite)marker(stereo(g.pts[current]),current==='Pnext'?'P⁺':current,true);for(let name of ['P','T','G','Gother','L1'])if(name!==current&&((name==='P')||(name==='L1'&&n>=2)||(name==='T'&&n>=2*g.p-1)||(name.startsWith('G')&&n>=2*g.p)))marker(stereo(g.pts[name]),name==='Gother'?'G′':name==='L1'?'L₁':name);
let pw=plane.parentElement.clientWidth,ph=sh;plane.setAttribute('viewBox',`0 0 ${pw} ${ph}`);let xmin=Math.min(g.M[0]-g.rad,-2),xmax=Math.max(g.M[0]+g.rad,4.5),ymin=Math.min(g.M[1]-g.rad,-.4),ymax=Math.max(g.M[1]+g.rad,4.6),sc=Math.min((pw-50)/(xmax-xmin),(ph-45)/(ymax-ymin)),cx=(xmin+xmax)/2,cy=(ymin+ymax)/2,xy=a=>[pw/2+(a[0]-cx)*sc,ph/2-(a[1]-cy)*sc];function pline(l,color,width=1,opacity=1){let [a,b,c]=l,d=a*a+b*b,base=[-a*c/d,-b*c/d],dr=[-b,a],v=xy([base[0]-50*dr[0],base[1]-50*dr[1]]),w=xy([base[0]+50*dr[0],base[1]+50*dr[1]]);add(plane,'line',{x1:v[0],y1:v[1],x2:w[0],y2:w[1],stroke:color,'stroke-width':width,opacity})}
for(let l of [[0,1,-4],[1,0,0],[1,0,-2],[0,1,0]])pline(l,'var(--border)');let m=xy(g.M);add(plane,'circle',{cx:m[0],cy:m[1],r:g.rad*sc,fill:'none',stroke:'var(--viz-series-2)','stroke-width':1.6});for(let i=0;i<n;i++)pline(g.ops[i].line,i===n-1?'var(--viz-series-1)':'var(--foreground)',i===n-1?2:1,i===n-1?1:.2);
let used=[];for(let name of [...new Set([current,'O','A','B','C','P',...(n>=2*g.p-1?['T']:[]),...(n>=2*g.p?['G','Gother']:[])].filter(Boolean))]){let a=affine(g.pts[name]);if(!a)continue;let v=xy(a);if(v[0]<6||v[0]>pw-6||v[1]<6||v[1]>ph-6)continue;add(plane,'circle',{cx:v[0],cy:v[1],r:name===current?4:2.5,fill:name===current?'var(--viz-series-1)':'var(--foreground)'});let text=name==='Pnext'?'P⁺':name==='Gother'?'G′':name,len=text.length*7+4;for(let [dx,dy]of [[7,-8],[7,18],[-len-7,-8],[-len-7,18]]){let b={x:v[0]+dx,y:v[1]+dy-12,w:len,h:16};if(b.x<1||b.x+b.w>pw-1||used.some(a=>b.x<a.x+a.w+3&&b.x+b.w+3>a.x&&b.y<a.y+a.h+3&&b.y+b.h+3>a.y))continue;add(plane,'text',{x:b.x,y:v[1]+dy},text);used.push(b);break}}
if(infinite)add(plane,'text',{x:10,y:22},current+' : direction à l’infini');q('#fs-prev').disabled=n===0;q('#fs-next').disabled=n===g.ops.length;q('#fs-step-name').textContent=n?`${n} / ${g.ops.length} · ${g.ops[n-1].label}`:'Préparation fixe';q('#fs-result').textContent=`s⁺ ≈ ${g.value.toPrecision(12)} · ${g.ops.length} joins projectifs · ${infinite?'centre affiché au pôle Nord':'Γ reste un cercle sur la sphère'}`;
}
function update(reset=true){try{g=geometry();q('#fs-error').hidden=true;q('#fs-step').max=g.ops.length;if(reset)q('#fs-step').value=g.ops.length;draw()}catch(e){g=null;q('#fs-error').hidden=false;q('#fs-error').textContent=e.message;q('#fs-result').textContent='';q('.fs-sphere').replaceChildren();q('.fs-plane').replaceChildren()}}
for(let id of ['#fs-p','#fs-x','#fs-s'])q(id).onchange=()=>update();for(let id of ['#fs-step','#fs-yaw','#fs-pitch'])q(id).oninput=draw;q('#fs-prev').onclick=()=>{q('#fs-step').value=+q('#fs-step').value-1;draw()};q('#fs-next').onclick=()=>{q('#fs-step').value=+q('#fs-step').value+1;draw()};q('#fs-case').onchange=()=>{let value=q('#fs-case').value;q('#fs-p').value=3;q('#fs-x').value=2;q('#fs-s').value=value==='initial'?1:value==='final'?Math.cbrt(7.75/2):.75;update();q('#fs-step').value=value==='initial'?1:value==='final'?7:8;draw()};let drag=null,svg=q('.fs-sphere');svg.onpointerdown=e=>{drag=[e.clientX,e.clientY,+q('#fs-yaw').value,+q('#fs-pitch').value];svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(!drag)return;q('#fs-yaw').value=((drag[2]+(e.clientX-drag[0])*.5+540)%360)-180;q('#fs-pitch').value=Math.max(-80,Math.min(80,drag[3]+(e.clientY-drag[1])*.4));draw()};svg.onpointerup=()=>drag=null;svg.onpointercancel=()=>drag=null;new ResizeObserver(draw).observe(root);update();
})();
</script>
