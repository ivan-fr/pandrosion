   <g id="text_1">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #187e77" x="91.8" y="140.495982" transform="rotate(-0 91.8 140.495982)">Entrée m</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243b42" x="91.8" y="167.6756" transform="rotate(-0 91.8 167.6756)">1 ≤ m ≤ 2</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #187e77" x="255.96" y="140.495982" transform="rotate(-0 255.96 140.495982)">Chaîne de produits</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243b42" x="255.96" y="167.6756" transform="rotate(-0 255.96 167.6756)">q₂ = s², …, qₚ = sᵖ</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #187e77" x="426.96" y="140.495982" transform="rotate(-0 426.96 140.495982)">Résidu t</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243b42" x="426.96" y="167.6756" transform="rotate(-0 426.96 167.6756)">t = m qₚ</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #187e77" x="594.54" y="140.275552" transform="rotate(-0 594.54 140.275552)">Rapport AD</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #243b42" transform="translate(568.971641 161.974672)">N = 1 + αt</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #243b42" transform="translate(571.889922 173.376527)">D = α + t</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #7956a4" x="791.19" y="140.275982" transform="rotate(-0 791.19 140.275982)">Valeur suivante</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243b42" x="791.19" y="167.6756" transform="rotate(-0 791.19 167.6756)">s⁺ = s N / D</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #7956a4" x="777.51" y="276.797824" transform="rotate(-0 777.51 276.797824)">Mémoire candidate</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #243b42" transform="translate(721.960977 299.539682)">Buffer · interrupteur φA</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #243b42" transform="translate(726.361406 310.94228)">Condensateur 100 pF</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #7956a4" x="447.48" y="276.797824" transform="rotate(-0 447.48 276.797824)">Mémoire de l’état s</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #243b42" transform="translate(391.921328 299.539682)">Buffer · interrupteur φB</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #243b42" transform="translate(396.331406 310.94228)">Condensateur 100 pF</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #8b989c" x="615.06" y="269.629714" transform="rotate(-0 615.06 269.629714)">copie isolée</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #7956a4" x="625.32" y="75.943954" transform="rotate(-0 625.32 75.943954)">État maintenu pendant le calcul</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #187e77" x="160.2" y="396.137125" transform="rotate(-0 160.2 396.137125)">Sortie géométrique</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243b42" x="160.2" y="423.317114" transform="rotate(-0 160.2 423.317114)">y = m sᵖ⁻¹ · voie de comparaison</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #7956a4" x="447.48" y="396.137125" transform="rotate(-0 447.48 396.137125)">Sortie réciproque</text>
   </g>
