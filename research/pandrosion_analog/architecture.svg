    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243b42" x="447.48" y="423.507114" transform="rotate(-0 447.48 423.507114)">y = 1/s · même limite</text>
   </g>
   <g id="text_21">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #243b42" transform="translate(648.201719 377.165251)">α = (p − 1)/(p + 1)</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #243b42" transform="translate(615.324609 394.60197)">φA et φB ne se recouvrent pas.</text>
